name: Build VPNSOPR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          set -euo pipefail
          unzip -oq VPNSOPR-Android-Source.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f scripts/patch_android.py
          test -f assets/vpnsopr_icon.png

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          test -n "$SM"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"

          yes | "$SM" --sdk_root="$SDK" --licenses || true

          "$SM" --sdk_root="$SDK" --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

          mkdir -p "$SDK/platforms"
          ln -sfn android-37.0 "$SDK/platforms/android-37"

          test -f "$SDK/platforms/android-37/android.jar"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android project
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

      - name: Configure Android
        run: python3 scripts/patch_android.py

      - name: Fix dependency version
        run: |
          set -euo pipefail
          sed -i 's/file_picker: \^10\.3\.3/file_picker: ^13.3.0/' pubspec.yaml
          grep 'file_picker:' pubspec.yaml

      - name: Migrate FilePicker API
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("lib")

          if not root.exists():
              raise SystemExit("lib directory not found")

          changed = []

          for path in root.rglob("*.dart"):
              source = path.read_text(encoding="utf-8")
              original = source

              source = source.replace(
                  "FilePicker.platform.pickFiles(",
                  "FilePicker.pickFiles("
              )

              source = source.replace(
                  "FilePicker.platform.saveFile(",
                  "FilePicker.saveFile("
              )

              source = re.sub(
                  r"(?m)^\s*withData:\s*true,\s*\n",
                  "",
                  source
              )

              source = re.sub(
                  r"if\s*\(\s*(\w+)\s*==\s*null\s*\|\|\s*\1\.files\.isEmpty\s*\)\s*return;",
                  r"if (\1.isEmpty) return;",
                  source
              )

              source = re.sub(
                  r"\b(\w+)\.files\.first\b",
                  r"\1.first",
                  source
              )

              source = source.replace(
                  "file.bytes ?? (file.path != null ? await File(file.path!).readAsBytes() : null)",
                  "await file.readAsBytes()"
              )

              if "FilePicker.platform." in source:
                  raise SystemExit(
                      f"Old FilePicker API remains in {path}"
                  )

              if "withData: true" in source and "FilePicker." in source:
                  raise SystemExit(
                      f"Old withData parameter remains in {path}"
                  )

              if source != original:
                  path.write_text(source, encoding="utf-8")
                  changed.append(str(path))

          print("Migrated FilePicker files:")

          for path in changed:
              print(" -", path)

          print("FilePicker migration complete.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze lib --no-pub

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
