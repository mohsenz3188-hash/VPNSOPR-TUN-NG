
name: Build VPNSOPR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VPNSOPR source archive
        shell: bash
        run: |
          if [[ -f "VPNSOPR-Android-Source.zip" ]]; then
            unzip -oq "VPNSOPR-Android-Source.zip" -d .
          fi

          for required_file in pubspec.yaml lib/main.dart assets/vpnsopr_icon.png scripts/patch_android.py; do
            if [[ ! -f "$required_file" ]]; then
              echo "::error::Missing $required_file. Upload VPNSOPR-Android-Source.zip to repository root."
              exit 1
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Generate Android host project if missing
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle.kts && ! -f android/app/build.gradle ]]; then
            flutter create --platforms=android --org com.vpnsopr --project-name vpnsopr --no-pub .
          fi

      - name: Configure Android project
        run: python3 scripts/patch_android.py

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          
