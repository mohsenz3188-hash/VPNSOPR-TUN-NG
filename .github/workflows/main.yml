
name: Build VPNSOPR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VPNSOPR Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          unzip -oq VPNSOPR-Android-Source.zip -d .

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f scripts/patch_android.py
          test -f assets/vpnsopr_icon.png

      - name: Apply fixed importer
        shell: bash
        run: |
          set -euo pipefail

          test -f profile_importer.dart
          test -f wireguard_parser.dart

          TARGET="$(find lib -type f -name 'profile_importer.dart' -print -quit)"

          if [ -z "$TARGET" ]; then
            echo "ERROR: profile_importer.dart not found in lib"
            exit 1
          fi

          TARGET_DIR="$(dirname "$TARGET")"

          cp profile_importer.dart "$TARGET"

          if [ -f "$TARGET_DIR/wireguard_parser.dart" ]; then
            echo "WireGuard parser already exists"
          else
            cp wireguard_parser.dart "$TARGET_DIR/wireguard_parser.dart"
          fi

          cmp -s profile_importer.dart "$TARGET"

          echo "Importer successfully replaced: $TARGET"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          test -n "$SM"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SM" --sdk_root="$SDK" --licenses || true

          "$SM" --sdk_root="$SDK" --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

          mkdir -p "$SDK/platforms"
          ln -sfn android-37.0 "$SDK/platforms/android-37"

          test -f "$SDK/platforms/android-37/android.jar"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android project
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle.kts && ! -f android/app/build.gradle ]]; then
            flutter create \
              --platforms=android \
              --org com.vpnsopr \
              --project-name vpnsopr \
              --no-pub .
          fi

      - name: Configure Android
        run: python3 scripts/patch_android.py

      - name: Enable Core Library Desugaring
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              gradle = kts
              enabled = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
              android_block = """
          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }
          """
              dependency_block = """
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """
          elif groovy.exists():
              gradle = groovy
              enabled = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              android_block = """
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          """
              dependency_block = """
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          }
          """
          else:
              raise SystemExit("Gradle file not found")

          content = gradle.read_text(encoding="utf-8")

          if enabled not in content:
              content += "\n" + android_block

          if dependency not in content:
              content += "\n" + dependency_block

          gradle.write_text(content, encoding="utf-8")

          print("Desugaring configured")
          PY

      - name: Fix FilePicker dependency
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/file_picker: \^10\.3\.3/file_picker: ^13.3.0/' pubspec.yaml

      - name: Migrate FilePicker API
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("lib").rglob("*.dart"):
              source = path.read_text(encoding="utf-8")

              source = source.replace(
                  "FilePicker.platform.pickFiles(",
                  "FilePicker.pickFiles("
              )

              source = source.replace(
                  "FilePicker.platform.saveFile(",
                  "FilePicker.saveFile("
              )

              source = re.sub(
                  r"(?m)^\s*withData:\s*true,\s*\n",
                  "",
                  source
              )

              source = re.sub(
                  r"\b(\w+)\.files\.first\b",
                  r"\1.first",
                  source
              )

              source = source.replace(
                  "file.bytes ?? (file.path != null ? await File(file.path!).readAsBytes() : null)",
                  "await file.readAsBytes()"
              )

              path.write_text(source, encoding="utf-8")

          print("FilePicker migration completed")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Fix JitPack repositories
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("android/build.gradle.kts"),
              Path("android/build.gradle")
          ]

          root = next((p for p in paths if p.exists()), None)

          if root is None:
              raise SystemExit("Android root Gradle file missing")

          content = root.read_text(encoding="utf-8")

          if "https://jitpack.io" not in content:
              if root.suffix == ".kts":
                  block = """
          allprojects {
              repositories {
                  maven("https://jitpack.io")
              }
          }
          """
              else:
                  block = """
          allprojects {
              repositories {
                  maven { url 'https://jitpack.io' }
              }
          }
          """

              root.write_text(content.rstrip() + "\n" + block, encoding="utf-8")

          print("JitPack configured")
          PY

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-pub
        continue-on-error: false

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          
